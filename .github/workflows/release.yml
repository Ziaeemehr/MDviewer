name: Release

# Builds the desktop installers and publishes them as a GitHub release.
# Trigger: push a tag such as v0.1.0 (or run manually to only test the builds).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            rust-targets: ''
            out: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            args: --bundles deb
            rust-targets: ''
            out: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Prepare web files and icons
        shell: bash
        run: |
          mkdir -p dist
          cp -R index.html vendor dist/
          tauri icon src-tauri/app-icon.png

      - name: Build installer
        run: tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "MD Viewer $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
