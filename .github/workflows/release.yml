name: Release

# Builds the desktop installers and publishes them as a GitHub release.
# Trigger: push a tag such as v0.1.0 (or run manually to only test the builds).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            rust-targets: ''
            out: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            args: --bundles deb
            rust-targets: ''
            out: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Prepare web files and icons
        shell: bash
        run: |
          mkdir -p dist
          cp -R index.html vendor dist/
          tauri icon src-tauri/app-icon.png

      - name: Build installer
        run: tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK and NDK installed.
      - name: Use preinstalled Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Gradle calls the CLI back with "npm run tauri", so it needs a package.json with that
      # script; the repo has none, so a throwaway one is made here.
      - name: Install Tauri CLI
        run: |
          npm init -y > /dev/null
          npm pkg set scripts.tauri=tauri
          npm install --no-save @tauri-apps/cli@2

      # The Android project under src-tauri/gen is generated here, like the desktop icons.
      - name: Prepare web files, Android project and icons
        run: |
          mkdir -p dist
          cp -R index.html vendor dist/
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/app-icon.png

      - name: Build APK
        run: npm run tauri -- android build --apk --ci

      # Sign with the release key from the repository secrets. Without them a throwaway key
      # is used: the APK installs, but a later one signed with a different key cannot update it.
      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
          else
            echo "::warning::ANDROID_KEYSTORE secret not set; signing with a throwaway key"
            KEY_ALIAS=mdviewer KEY_PASSWORD=throwaway
            keytool -genkeypair -keystore release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=MD Viewer"
          fi
          version=$(jq -r .version src-tauri/tauri.conf.json)
          unsigned=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out "MD-Viewer_${version}_android.apk" aligned.apk
          "$tools/apksigner" verify "MD-Viewer_${version}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-Android
          path: MD-Viewer_*_android.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "MD Viewer $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
