[package]
name = "mdviewer"
version = "0.2.0"
description = "Lightweight Markdown viewer for mixed Persian/English text with LaTeX"
authors = ["Abolfazl Ziaeemehr"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
