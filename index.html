<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('mdv-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var lang = 'fa';
    try { lang = localStorage.getItem('mdv-lang') === 'en' ? 'en' : 'fa'; } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  })();
</script>

<style>
  @font-face {
    font-family: Vazirmatn;
    src: url("vendor/fonts/Vazirmatn.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --bg: #ffffff;
    --bg-soft: #f5f6f8;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d8dde3;
    --accent: #0b63ce;
    --code-bg: #f1f3f5;
    --mark: #fff3bf;
    --hl-comment: #6e7781;
    --hl-keyword: #cf222e;
    --hl-string: #0a3069;
    --hl-number: #0550ae;
    --hl-title: #8250df;
    --hl-builtin: #953800;
    --hl-tag: #116329;
  }
  :root[data-theme="dark"] {
    --bg: #15181c;
    --bg-soft: #1c2026;
    --fg: #e3e6ea;
    --muted: #98a2ad;
    --border: #2f353d;
    --accent: #6cb0ff;
    --code-bg: #232830;
    --mark: #5c4a00;
    --hl-comment: #8b949e;
    --hl-keyword: #ff7b72;
    --hl-string: #a5d6ff;
    --hl-number: #79c0ff;
    --hl-title: #d2a8ff;
    --hl-builtin: #ffa657;
    --hl-tag: #7ee787;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color-scheme: light;
    overflow: hidden;  /* only the panes scroll, never the window */
    /* Android 15+ draws the app under the status and navigation bars */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  :root[data-theme="dark"] body { color-scheme: dark; }

  /* ---------- toolbar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    flex: none;
    flex-wrap: wrap;
  }
  header .name {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    unicode-bidi: plaintext;
    text-align: start;
  }
  button {
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- find ---------- */
  #findbar {
    display: flex;
    flex: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
  }
  #findbar[hidden] { display: none; }
  #findbar input {
    flex: 1 1 130px;
    min-width: 0;
    max-width: 320px;
    width: 130px;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
  }
  #find-case[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  #find-count { font-size: 13px; color: var(--muted); }
  #find-text[aria-invalid="true"] { border-color: #c62828; outline-color: #c62828; }

  /* ---------- tabs ---------- */
  #tabs {
    display: flex;
    flex: none;
    gap: 2px;
    padding: 4px 8px 0;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 240px;
    padding: 4px 10px;
    padding-inline-end: 4px;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { background: var(--bg); color: var(--fg); border-color: var(--border); }
  .tab-name { overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
  .tab.dirty .tab-name::before { content: "● "; color: var(--accent); }
  #tabs button { border: 0; background: none; padding: 0 7px; border-radius: 6px; color: var(--muted); }
  #tabs button:hover { background: var(--border); color: var(--fg); }
  #tabs .tab-close.confirm { background: #c62828; color: #fff; font-size: 12px; padding: 1px 8px; }
  #tab-new { align-self: center; font-size: 16px; }

  /* ---------- layout ---------- */
  main { flex: 1; display: flex; min-height: 0; direction: ltr; }
  #editor, #preview { min-width: 0; height: 100%; }
  #editor { flex: 0 0 var(--split, 50%); }
  #preview { flex: 1 1 0; }
  #divider {
    flex: none;
    width: 5px;
    cursor: col-resize;
    background: var(--border);
    touch-action: none;
  }
  #divider:hover, body.resizing #divider { background: var(--accent); }
  body.resizing { user-select: none; cursor: col-resize; }
  #editor {
    resize: none;
    border: 0;
    outline: 0;
    padding: 20px;
    background: var(--bg-soft);
    color: var(--fg);
    font-family: Vazirmatn, ui-monospace, Menlo, Consolas, monospace;
    font-size: calc(15px * var(--zoom, 1));
    line-height: 1.9;
    /* each line picks its own direction from its first strong character */
    unicode-bidi: plaintext;
    text-align: start;
  }
  /* a forced direction (RTL/LTR button) overrides the per-line detection */
  #editor[dir] { unicode-bidi: normal; }
  /* position: relative keeps absolutely positioned bits (KaTeX's hidden MathML) inside
     the preview; otherwise they stretch the page itself and PageDown scrolls it off-screen */
  #preview { position: relative; overflow: auto; padding: 28px 24px 80px; outline: 0; }
  body.no-editor #editor, body.no-editor #divider { display: none; }
  body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    #divider { display: none; }
    #editor { border-bottom: 1px solid var(--border); flex: 0 0 40%; height: auto; }
    #preview { padding: 20px 16px 60px; height: auto; }
    /* icons only, so the toolbar stays on one line */
    header { flex-wrap: nowrap; gap: 4px; padding: 8px; }
    header .label, #findbar .label { display: none; }
    header button { padding: 5px 6px; }
  }
  /* ---------- update notice ---------- */
  #update {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 14px;
    background: var(--mark);
    border-bottom: 1px solid var(--border);
    flex: none;
    flex-wrap: wrap;
  }
  #update[hidden] { display: none; }

  /* ---------- about ---------- */
  #about {
    width: min(420px, calc(100vw - 32px));
    padding: 20px 22px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
  }
  #about::backdrop { background: rgba(0, 0, 0, .4); }
  #about h2 { margin: 0 0 4px; font-size: 20px; }
  #about p { margin: 0 0 14px; color: var(--muted); line-height: 1.7; }
  #about dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 14px; }
  #about dt { color: var(--muted); }
  #about dd { margin: 0; }
  #about ul { margin: 0 0 16px; padding-inline-start: 20px; line-height: 1.9; }
  #about a { color: var(--accent); }
  #about-note { font-size: 13px; }
  #about .zoom { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }
  #about .zoom span:first-child { flex: 1; color: var(--muted); }
  #zoom-value { min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
  #about .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  #update-msg { flex: 1; min-width: 0; }

  /* touch screens: larger targets for the small tab buttons */
  @media (pointer: coarse) {
    .tab { padding-block: 8px; }
    #tabs button { padding: 4px 10px; }
  }

  /* ---------- rendered markdown ---------- */
  .md { max-width: calc(820px * var(--zoom, 1)); margin: 0 auto; font-size: calc(17px * var(--zoom, 1)); line-height: 2; overflow-wrap: break-word; }
  .md > :first-child { margin-top: 0; }
  .md [dir] { text-align: start; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.5; margin: 1.6em 0 0.6em; }
  .md h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
  .md h2 { font-size: 1.5em; padding-bottom: 0.2em; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 1.25em; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 1em; }
  .md ul, .md ol { padding-inline-start: 1.8em; }
  .md li > ul, .md li > ol { margin-bottom: 0; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md img { max-width: 100%; height: auto; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .md mark { background: var(--mark); color: inherit; }
  .md blockquote {
    padding: 0.2em 1em;
    color: var(--muted);
    border-inline-start: 4px solid var(--border);
  }
  .md blockquote > :last-child { margin-bottom: 0; }

  /* code is always left-to-right, even inside a Persian paragraph */
  .md code, .md pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, Vazirmatn, monospace;
    font-size: 0.88em;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .md .code-wrap { position: relative; margin-bottom: 1em; }
  .md .code-wrap pre { margin: 0; }
  .md .copy {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 12px;
    padding: 2px 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .md .code-wrap:hover .copy, .md .copy:focus { opacity: 1; }
  .md li:has(> input[type="checkbox"]) { list-style: none; margin-inline-start: -1.4em; }
  .md code { background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 5px; }
  .md pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    line-height: 1.6;
    text-align: left;
  }
  .md pre code { background: none; padding: 0; font-size: 1em; }

  /* syntax highlighting (highlight.js token classes) */
  .md .hljs-comment, .md .hljs-quote, .md .hljs-meta { color: var(--hl-comment); }
  .md .hljs-comment, .md .hljs-quote { font-style: italic; }
  .md .hljs-keyword, .md .hljs-selector-tag, .md .hljs-doctag, .md .hljs-deletion { color: var(--hl-keyword); }
  .md .hljs-string, .md .hljs-regexp, .md .hljs-addition { color: var(--hl-string); }
  .md .hljs-number, .md .hljs-literal, .md .hljs-attr, .md .hljs-attribute, .md .hljs-variable,
  .md .hljs-template-variable, .md .hljs-symbol, .md .hljs-bullet, .md .hljs-link,
  .md .hljs-selector-attr, .md .hljs-selector-pseudo { color: var(--hl-number); }
  .md .hljs-title, .md .hljs-section, .md .hljs-selector-id, .md .hljs-selector-class { color: var(--hl-title); }
  .md .hljs-built_in, .md .hljs-type { color: var(--hl-builtin); }
  .md .hljs-name, .md .hljs-tag { color: var(--hl-tag); }
  .md .hljs-emphasis { font-style: italic; }
  .md .hljs-strong { font-weight: 700; }

  .md .table-wrap { overflow-x: auto; margin-bottom: 1em; }
  .md table { border-collapse: collapse; margin: 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 14px; }
  .md th { background: var(--bg-soft); }

  .md input[type="checkbox"] { margin-inline-end: 0.4em; }

  /* formulas are always left-to-right */
  .md .katex { direction: ltr; unicode-bidi: isolate; font-size: 1.1em; }
  .md .math-block { direction: ltr; overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 0 0 1em; }
  .md .math-block .katex-display { margin: 0.4em 0; }

  @media print {
    :root, :root[data-theme="dark"] {
      --bg: #fff; --bg-soft: #f5f6f8; --fg: #000; --muted: #555;
      --border: #ccc; --accent: #0b63ce; --code-bg: #f1f3f5; --mark: #fff3bf;
      --hl-comment: #6e7781; --hl-keyword: #cf222e; --hl-string: #0a3069; --hl-number: #0550ae;
      --hl-title: #8250df; --hl-builtin: #953800; --hl-tag: #116329;
    }
    header, #update, #findbar, #tabs, #editor, #divider, .md .copy { display: none !important; }
    .md pre { white-space: pre-wrap; }
    body, main, #preview { display: block; height: auto; overflow: visible; }
    #preview { padding: 0; }
  }
</style>
</head>

<script type="text/markdown" id="sample"># راهنمای MD Viewer

این یک نمایشگر ساده‌ی **Markdown** است که متن فارسی و English را در کنار هم درست نمایش می‌دهد.
هر پاراگراف جهت خودش را از اولین حرف می‌گیرد.

This paragraph starts in English, so it is left-to-right — even if it contains کلمات فارسی in the middle.

## فرمول‌ها (LaTeX)

فرمول درون‌خطی مثل $E = mc^2$ یا \(a^2 + b^2 = c^2\) وسط متن فارسی می‌آید، و فرمول جدا:

$$
\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
$$

\[
\hat{f}(\xi) = \int_{-\infty}^{\infty} f(x)\, e^{-2\pi i x \xi}\, dx
\]

قیمت‌ها مثل $5 و $10 فرمول حساب نمی‌شوند.

## فهرست و جدول

- مورد اول با `inline code`
- Second item in English
- [x] کار انجام‌شده
- [ ] کار باقی‌مانده

| نام | Symbol | مقدار |
|-----|:------:|------:|
| عدد پی | $\pi$ | 3.14159 |
| عدد اویلر | $e$ | 2.71828 |

## کد

```python
def greet(name):
    return f"سلام {name}!"
```

```julia
f(x) = x^2 + 1          # تابع یک‌خطی
println(sum(f, 1:10))
```

> نقل‌قول: برای باز کردن فایل، آن را به داخل صفحه بکشید یا دکمه‌ی «باز کردن» را بزنید.
</script>

    if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    if (e.key !== 'Enter') return;
    if (e.target === findText) { e.preventDefault(); findNext(e.shiftKey ? -1 : 1); }
    if (e.target === replaceText) { e.preventDefault(); replaceMatch(); }
  });
  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !e.isComposing && !findbar.hidden) closeFind();
  });

  /* ---------- files ---------- */

  var FILE_TYPES = [{
    description: 'Markdown',
    accept: { 'text/markdown': ['.md', '.markdown', '.mdown'], 'text/plain': ['.txt'] }
  }];

  function report(err) {
    if (!err || err.name !== 'AbortError') alert(err);
  }

  // The tab that already shows this file, if any.
  function sameFile(d) {
    if (d.path) return Promise.resolve(tabs.filter(function (t) { return t.path === d.path; })[0]);
    if (!d.handle) return Promise.resolve(null);
    return Promise.all(tabs.map(function (t) {
      return t.handle ? t.handle.isSameEntry(d.handle) : false;
    })).then(function (same) { return tabs[same.indexOf(true)]; });
  }

  // Show a document in a tab: its existing tab, the untouched starting tab, or a new one.
  function openDoc(d) {
    return sameFile(d).then(function (tab) {
      if (tab) {
        if (!tab.dirty) tab.text = d.text;
      } else {
        tab = newTab(d);
        var blank = !active.dirty && !active.name && !active.path && !active.handle;
        // the file takes the place of the blank tab, so it keeps that tab's direction
        if (blank) { tab.dir = active.dir; tabs.splice(tabs.indexOf(active), 1, tab); active = null; }
        else tabs.push(tab);
      }
      activate(tab);
    });
  }

  function openDocs(docs) {
    return docs.reduce(function (p, d) {
      return p.then(function () { return openDoc(d); });
    }, Promise.resolve());
  }

  // File objects from the file input or a drop; the browser hides where they live.
  function openFileObjects(files) {
    return Promise.all(Array.prototype.map.call(files, function (f) {
      return f.text().then(function (text) { return { name: f.name, text: text }; });
    })).then(openDocs).catch(report);
  }

  function openFiles() {
    // Desktop app: a native dialog, so the file's path is known for saving later.
    var tauri = window.__TAURI__;
    if (tauri && tauri.core) {
      tauri.core.invoke('open_markdown', { path: active.path }).then(function (files) {
        return openDocs(files.map(function (f) { return { name: f.name, path: f.path, text: f.contents }; }));
      }).catch(report);
      return;
    }
    if (window.showOpenFilePicker) {
      var opts = { id: 'mdv', multiple: true, types: FILE_TYPES };
      if (active.handle) opts.startIn = active.handle;
      window.showOpenFilePicker(opts).then(function (handles) {
        return Promise.all(handles.map(function (h) {
          return h.getFile()
            .then(function (f) { return f.text(); })
            .then(function (text) { return { name: h.name, handle: h, text: text }; });
        }));
      }).then(openDocs).catch(report);
      return;
    }
    $('file').click();
  }

  $('btn-open').addEventListener('click', openFiles);
  $('file').addEventListener('change', function (e) {
    openFileObjects(e.target.files);
    e.target.value = '';
  });

  var dragDepth = 0;
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0; }
  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    dragDepth++;
    document.body.classList.add('dragging');
  });
  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
  });
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    openFileObjects(e.dataTransfer.files);
  });

  /* ---------- theme & editor toggle ---------- */

  var root = document.documentElement;
  function paintThemeButton() {
    setLabel($('btn-theme'), root.dataset.theme === 'dark' ? t('light') : t('dark'));
  }
  $('btn-theme').addEventListener('click', function () {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    store.set('mdv-theme', root.dataset.theme);
    paintThemeButton();
  });
  paintThemeButton();

  if (store.get('mdv-editor') === '0') document.body.classList.add('no-editor');
  $('btn-editor').addEventListener('click', function () {
    var hidden = document.body.classList.toggle('no-editor');
    store.set('mdv-editor', hidden ? '0' : '1');
    // find works on the editor text, so it goes away with the editor
    if (hidden) { revealedEditor = false; closeFind(); }
  });

  $('btn-dir').addEventListener('click', function () {
    active.dir = active.dir === 'auto' ? 'rtl' : active.dir === 'rtl' ? 'ltr' : 'auto';
    persist();
    applyDir();
    render();
  });

  /* ---------- save / print ---------- */

  function markSaved(tab, d) {
    if (d.name) tab.name = d.name;
    if (d.path) tab.path = d.path;
    if (d.handle) tab.handle = d.handle;
    tab.dirty = false;
    paintTabs();
    persist();
    flashSave('saved');
  }

  var saveFlash = null, saveTimer;
  function flashSave(msg) {
    var b = $('btn-save');
    saveFlash = msg;
    setLabel(b, t(msg));
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveFlash = null; setLabel(b, t('save')); }, 1200);
  }

  // Save writes back to the tab's own file when it has one; Save As (or a tab that was
  // never saved to a known file) asks where to save.
  function saveTab(saveAs) {
    var tab = active, text = tab.text, n = tab.name || 'document.md';
    saveAs = saveAs === true;
    // Nothing changed since the file was opened or last saved: no dialog.
    if (!saveAs && tab.name && !tab.dirty) { flashSave('unchanged'); return; }

    // Desktop app: written in place when the path is known, else a native save dialog
    // that starts in the file's own folder.
    var tauri = window.__TAURI__;
    if (tauri && tauri.core) {
      tauri.core.invoke('save_markdown', { name: n, path: tab.path, contents: text, saveAs: saveAs }).then(function (saved) {
        if (saved) markSaved(tab, saved);
      }).catch(report);
      return;
    }
    if (window.showSaveFilePicker) {
      var write = function (h) {
        return h.createWritable()
          .then(function (w) { return w.write(text).then(function () { return w.close(); }); })
          .then(function () { markSaved(tab, { handle: h, name: h.name }); });
      };
      var pick = function () {
        var opts = { id: 'mdv', suggestedName: n, types: FILE_TYPES };
        if (tab.handle) opts.startIn = tab.handle;
        return window.showSaveFilePicker(opts).then(write);
      };
      // In place first; if the browser refuses write access, fall back to the picker.
      (tab.handle && !saveAs ? write(tab.handle).catch(function (err) {
        if (err && err.name === 'AbortError') throw err;
        return pick();
      }) : pick()).catch(report);
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    a.download = n;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    markSaved(tab, {});
  }

  $('btn-save').addEventListener('click', function (e) { saveTab(e.shiftKey); });
  $('btn-pdf').addEventListener('click', function () { window.print(); });
  // The Android WebView has no print dialog, so the button would do nothing there.
  if (window.__TAURI__ && /Android/.test(navigator.userAgent)) $('btn-pdf').hidden = true;

  /* ---------- updates ---------- */

  // Desktop app: the updater downloads the signed installer from the latest GitHub release,
  // installs it and restarts. Android: the new APK is downloaded in the browser and the
  // system offers to install it over this one. The plain web page has nothing to update.
  var RELEASE_API = 'https://api.github.com/repos/Ziaeemehr/MDviewer/releases/latest';
  var DAY = 24 * 60 * 60 * 1000;

  var notice = null;
  function paintNotice() {
    if (!notice) return;
    $('update-msg').textContent = t(notice.key, notice.params);
    $('update-go').textContent = notice.action ? t(notice.action) : '';
  }
  function updateNotice(key, params, action, run) {
    notice = { key: key, params: params, action: action };
    paintNotice();
    $('update-go').hidden = !action;
    $('update-go').onclick = run || null;
    $('update').hidden = false;
  }
  $('update-close').addEventListener('click', function () { $('update').hidden = true; });

  // true if version a is newer than b ("0.10.0" > "0.9.1")
  function newer(a, b) {
    a = a.split('.').map(Number); b = b.split('.').map(Number);
    for (var i = 0; i < Math.max(a.length, b.length); i++) {
      if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
    }
    return false;
  }

  // Resolves to { version, install } when a newer version exists, else null.
  function findUpdate(tauri) {
    if (/Android/.test(navigator.userAgent)) {
      return Promise.all([
        tauri.app.getVersion(),
        fetch(RELEASE_API).then(function (r) {
          if (!r.ok) throw new Error('GitHub: ' + r.status);
          return r.json();
        })
      ]).then(function (res) {
        var version = res[1].tag_name.replace(/^v/, '');
        var apk = res[1].assets.filter(function (a) { return /\.apk$/.test(a.name); })[0];
        if (!apk || !newer(version, res[0])) return null;
        return {
          version: version, action: 'downloadInstall',
          install: function () {
            return tauri.core.invoke('open_url', { url: apk.browser_download_url }).then(function () {
              updateNotice('apkHint');
            });
          }
        };
      });
    }
    return tauri.core.invoke('check_update').then(function (info) {
      if (!info) return null;
      return {
        version: info.version, action: 'installRestart',
        install: function () {
          // Open documents, including unsaved text, come back after the restart.
          persist();
          updateNotice('downloading', { version: info.version });
          var stop = tauri.event.listen('update-progress', function (e) {
            var done = e.payload[0], total = e.payload[1];
            if (total) updateNotice('progress', { version: info.version, percent: Math.round(done / total * 100) });
          });
          return tauri.core.invoke('install_update').finally(function () {
            stop.then(function (unlisten) { unlisten(); });
          });
        }
      };
    });
  }

  // quiet: the automatic check at start, which says nothing unless it finds an update.
  function checkUpdate(quiet) {
    var tauri = window.__TAURI__;
    if (!quiet) updateNotice('checking');
    store.set('mdv-update-check', String(Date.now()));
    findUpdate(tauri).then(function (u) {
      if (!u) {
        if (!quiet) updateNotice('upToDate');
        return;
      }
      updateNotice('ready', { version: u.version }, u.action, function () {
        $('update-go').hidden = true;
        u.install().catch(function (err) {
          updateNotice('installFailed', { error: String(err) }, 'retry', function () { checkUpdate(false); });
        });
      });
    }).catch(function (err) {
      if (!quiet) updateNotice('checkFailed', { error: String(err) });
    });
  }

  if (window.__TAURI__) {
    $('btn-update').hidden = false;
    $('about-note').hidden = false;
    // the result shows in the notice bar under the toolbar
    $('btn-update').addEventListener('click', function () { $('about').close(); checkUpdate(false); });
    if (!(Date.now() - (+store.get('mdv-update-check') || 0) < DAY)) checkUpdate(true);
  }

  /* ---------- text size: scales the editor and the preview together ---------- */

  var ZOOM_MIN = 70, ZOOM_MAX = 200, ZOOM_STEP = 10;
  var zoom = +store.get('mdv-zoom');
  if (!(zoom >= ZOOM_MIN && zoom <= ZOOM_MAX)) zoom = 100;

  function paintZoom() {
    var shown = String(zoom);
    if (lang === 'fa') shown = shown.replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }) + '٪';
    else shown += '%';
    $('zoom-value').textContent = shown;
    $('zoom-out').disabled = zoom <= ZOOM_MIN;
    $('zoom-in').disabled = zoom >= ZOOM_MAX;
  }
  function setZoom(z) {
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    root.style.setProperty('--zoom', zoom / 100);
    store.set('mdv-zoom', String(zoom));
    paintZoom();
  }
  $('zoom-out').addEventListener('click', function () { setZoom(zoom - ZOOM_STEP); });
  $('zoom-in').addEventListener('click', function () { setZoom(zoom + ZOOM_STEP); });
  $('zoom-value').addEventListener('click', function () { setZoom(100); });
  setZoom(zoom);

  /* ---------- about ---------- */

  var about = $('about');
  $('btn-about').addEventListener('click', function () { about.showModal(); });
  $('about-close').addEventListener('click', function () { about.close(); });
  // a click on the backdrop lands on the dialog element itself
  about.addEventListener('click', function (e) { if (e.target === about) about.close(); });
  if (window.__TAURI__) {
    window.__TAURI__.app.getVersion().then(function (v) { $('about-version').textContent = v; });
  }
  // the installed app opens links in the system browser
  about.querySelectorAll('a').forEach(function (a) {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.addEventListener('click', function (e) {
      if (!window.__TAURI__) return;
      e.preventDefault();
      window.__TAURI__.core.invoke('open_url', { url: a.href });
    });
  });

  /* ---------- keyboard shortcuts ---------- */

  // Matched by physical key (e.code) so they also work on the Persian layout.
  // Browsers keep Ctrl+N/W/Tab for themselves; those three only reach us in the desktop app.
  // Replace is Ctrl+H, or Ctrl+Alt+F; on macOS only Cmd+Option+F, since Cmd+H hides the
  // app and Ctrl+H deletes a character there.
  var MAC = /Mac|iPhone|iPad/.test(navigator.platform);
  window.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    var replace = !e.shiftKey && (e.code === 'KeyF' && e.altKey ||
      e.code === 'KeyH' && e.ctrlKey && !e.altKey && !MAC);
    if (replace || (e.code === 'KeyF' && !e.shiftKey && !e.altKey)) {
      e.preventDefault();
      openFind(replace);
      return;
    }
    if (e.altKey) return;
    var run = {
      KeyO: openFiles,
      KeyS: function () { saveTab(e.shiftKey); },
      KeyN: function () { addTab(); },
      KeyW: function () { closeTab(active); },
      Tab: function () { cycleTab(e.shiftKey ? -1 : 1); },
      Equal: function () { setZoom(zoom + ZOOM_STEP); },
      NumpadAdd: function () { setZoom(zoom + ZOOM_STEP); },
      Minus: function () { setZoom(zoom - ZOOM_STEP); },
      NumpadSubtract: function () { setZoom(zoom - ZOOM_STEP); },
      Digit0: function () { setZoom(100); },
      Numpad0: function () { setZoom(100); }
    }[e.code];
    // Shift is part of Ctrl+Shift+S, Ctrl+Shift+Tab and of "+" on many layouts
    if (!run || (e.shiftKey && !/^(Tab|KeyS|Equal)$/.test(e.code))) return;
    e.preventDefault();
    run();
  });

  // Scroll keys pressed with nothing scrollable focused (at start, or after clicking a
  // button or a tab) would scroll nothing; hand focus to the preview so they scroll it.
  var SCROLL_KEYS = { PageDown: 1, PageUp: 1, Home: 1, End: 1, ArrowDown: 1, ArrowUp: 1, ' ': 1 };
  window.addEventListener('keydown', function (e) {
    if (!SCROLL_KEYS[e.key] || e.ctrlKey || e.metaKey || e.altKey) return;
    var el = document.activeElement;
    var idle = !el || el === document.body ||
      (el.tagName === 'BUTTON' && e.key !== ' ' && !preview.contains(el));
    if (idle) preview.focus({ preventScroll: true });
  });

  /* ---------- resizable divider ---------- */

  var mainEl = document.querySelector('main'), divider = $('divider');
  var split = store.get('mdv-split');
  if (split) mainEl.style.setProperty('--split', split);
  divider.addEventListener('pointerdown', function (e) {
    divider.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
  });
  divider.addEventListener('pointermove', function (e) {
    if (!divider.hasPointerCapture(e.pointerId)) return;
    var r = mainEl.getBoundingClientRect();
    var pct = Math.min(85, Math.max(15, (e.clientX - r.left) / r.width * 100));
    split = pct.toFixed(1) + '%';
    mainEl.style.setProperty('--split', split);
  });
  divider.addEventListener('pointerup', function () {
    document.body.classList.remove('resizing');
    if (split) store.set('mdv-split', split);
  });
  divider.addEventListener('dblclick', function () {
    mainEl.style.removeProperty('--split');
    store.set('mdv-split', '');
  });

  /* ---------- synced scrolling (proportional) ---------- */

  var scrollLock = null;
  function sync(from, to) {
    from.addEventListener('scroll', function () {
      if (restoring) return;
      if (scrollLock === from) { scrollLock = null; return; }
      var max = from.scrollHeight - from.clientHeight;
      if (max <= 0) return;
      var top = Math.round(from.scrollTop / max * (to.scrollHeight - to.clientHeight));
      if (Math.abs(top - to.scrollTop) < 1) return;
      scrollLock = to;
      to.scrollTop = top;
    });
  }
  sync(editor, preview);
  sync(preview, editor);

  /* ---------- start ---------- */

  applyLanguage();
  var restored = null;
  try { restored = JSON.parse(store.get('mdv-tabs')); } catch (e) {}
  // tabs saved before direction was per tab take the old shared setting
  var oldDir = store.get('mdv-dir');
  if (Array.isArray(restored) && restored.length) {
    tabs = restored.map(function (d) {
      if (d && !d.dir) d.dir = oldDir;
      return newTab(d);
    });
  } else if (store.get('mdv-text')) {
    // text kept by a version that had a single document
    var oldName = store.get('mdv-name');
    tabs = [newTab({ name: oldName, text: store.get('mdv-text'), dirty: !oldName, dir: oldDir })];
  } else {
    tabs = [newTab({ text: $('sample').textContent })];
  }
  activate(tabs[+store.get('mdv-active')] || tabs[0]);

  // Desktop app: files opened from the system (double click, "Open With") wait in the
  // backend; take them now and whenever it announces more.
  var tauri = window.__TAURI__;
  if (tauri && tauri.core) {
    var opening = Promise.resolve();
    var takePending = function () {
      opening = opening.then(function () {
        return tauri.core.invoke('pending_files');
      }).then(function (files) {
        return openDocs(files.map(function (f) { return { name: f.name, path: f.path, text: f.contents }; }));
      }).catch(report);
    };
    tauri.event.listen('files-pending', takePending).then(takePending, takePending);
  }
})();
</script>
</body>
</html>
