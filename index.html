<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Viewer</title>

<link rel="stylesheet" href="vendor/katex.min.css">

<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('mdv-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
  @font-face {
    font-family: Vazirmatn;
    src: url("vendor/fonts/Vazirmatn.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --bg: #ffffff;
    --bg-soft: #f5f6f8;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d8dde3;
    --accent: #0b63ce;
    --code-bg: #f1f3f5;
    --mark: #fff3bf;
    --hl-comment: #6e7781;
    --hl-keyword: #cf222e;
    --hl-string: #0a3069;
    --hl-number: #0550ae;
    --hl-title: #8250df;
    --hl-builtin: #953800;
    --hl-tag: #116329;
  }
  :root[data-theme="dark"] {
    --bg: #15181c;
    --bg-soft: #1c2026;
    --fg: #e3e6ea;
    --muted: #98a2ad;
    --border: #2f353d;
    --accent: #6cb0ff;
    --code-bg: #232830;
    --mark: #5c4a00;
    --hl-comment: #8b949e;
    --hl-keyword: #ff7b72;
    --hl-string: #a5d6ff;
    --hl-number: #79c0ff;
    --hl-title: #d2a8ff;
    --hl-builtin: #ffa657;
    --hl-tag: #7ee787;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color-scheme: light;
    overflow: hidden;  /* only the panes scroll, never the window */
  }
  :root[data-theme="dark"] body { color-scheme: dark; }

  /* ---------- toolbar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    flex: none;
    flex-wrap: wrap;
  }
  header .name {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    unicode-bidi: plaintext;
    text-align: start;
  }
  button {
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- tabs ---------- */
  #tabs {
    display: flex;
    flex: none;
    gap: 2px;
    padding: 4px 8px 0;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 240px;
    padding: 4px 10px;
    padding-inline-end: 4px;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { background: var(--bg); color: var(--fg); border-color: var(--border); }
  .tab-name { overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
  .tab.dirty .tab-name::before { content: "● "; color: var(--accent); }
  #tabs button { border: 0; background: none; padding: 0 7px; border-radius: 6px; color: var(--muted); }
  #tabs button:hover { background: var(--border); color: var(--fg); }
  #tabs .tab-close.confirm { background: #c62828; color: #fff; font-size: 12px; padding: 1px 8px; }
  #tab-new { align-self: center; font-size: 16px; }

  /* ---------- layout ---------- */
  main { flex: 1; display: flex; min-height: 0; direction: ltr; }
  #editor, #preview { min-width: 0; height: 100%; }
  #editor { flex: 0 0 var(--split, 50%); }
  #preview { flex: 1 1 0; }
  #divider {
    flex: none;
    width: 5px;
    cursor: col-resize;
    background: var(--border);
    touch-action: none;
  }
  #divider:hover, body.resizing #divider { background: var(--accent); }
  body.resizing { user-select: none; cursor: col-resize; }
  #editor {
    resize: none;
    border: 0;
    outline: 0;
    padding: 20px;
    background: var(--bg-soft);
    color: var(--fg);
    font-family: Vazirmatn, ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.9;
    /* each line picks its own direction from its first strong character */
    unicode-bidi: plaintext;
    text-align: start;
  }
  /* a forced direction (RTL/LTR button) overrides the per-line detection */
  #editor[dir] { unicode-bidi: normal; }
  /* position: relative keeps absolutely positioned bits (KaTeX's hidden MathML) inside
     the preview; otherwise they stretch the page itself and PageDown scrolls it off-screen */
  #preview { position: relative; overflow: auto; padding: 28px 24px 80px; outline: 0; }
  body.no-editor #editor, body.no-editor #divider { display: none; }
  body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    #divider { display: none; }
    #editor { border-bottom: 1px solid var(--border); flex: 0 0 40%; height: auto; }
    #preview { padding: 20px 16px 60px; height: auto; }
    button { padding: 5px 9px; }
    header .name { flex-basis: 100%; }
  }
  /* touch screens: larger targets for the small tab buttons */
  @media (pointer: coarse) {
    .tab { padding-block: 8px; }
    #tabs button { padding: 4px 10px; }
  }

  /* ---------- rendered markdown ---------- */
  .md { max-width: 820px; margin: 0 auto; font-size: 17px; line-height: 2; overflow-wrap: break-word; }
  .md > :first-child { margin-top: 0; }
  .md [dir] { text-align: start; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.5; margin: 1.6em 0 0.6em; }
  .md h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
  .md h2 { font-size: 1.5em; padding-bottom: 0.2em; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 1.25em; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 1em; }
  .md ul, .md ol { padding-inline-start: 1.8em; }
  .md li > ul, .md li > ol { margin-bottom: 0; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md img { max-width: 100%; height: auto; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .md mark { background: var(--mark); color: inherit; }
  .md blockquote {
    padding: 0.2em 1em;
    color: var(--muted);
    border-inline-start: 4px solid var(--border);
  }
  .md blockquote > :last-child { margin-bottom: 0; }

  /* code is always left-to-right, even inside a Persian paragraph */
  .md code, .md pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, Vazirmatn, monospace;
    font-size: 0.88em;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .md .code-wrap { position: relative; margin-bottom: 1em; }
  .md .code-wrap pre { margin: 0; }
  .md .copy {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 12px;
    padding: 2px 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .md .code-wrap:hover .copy, .md .copy:focus { opacity: 1; }
  .md li:has(> input[type="checkbox"]) { list-style: none; margin-inline-start: -1.4em; }
  .md code { background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 5px; }
  .md pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    line-height: 1.6;
    text-align: left;
  }
  .md pre code { background: none; padding: 0; font-size: 1em; }

  /* syntax highlighting (highlight.js token classes) */
  .md .hljs-comment, .md .hljs-quote, .md .hljs-meta { color: var(--hl-comment); }
  .md .hljs-comment, .md .hljs-quote { font-style: italic; }
  .md .hljs-keyword, .md .hljs-selector-tag, .md .hljs-doctag, .md .hljs-deletion { color: var(--hl-keyword); }
  .md .hljs-string, .md .hljs-regexp, .md .hljs-addition { color: var(--hl-string); }
  .md .hljs-number, .md .hljs-literal, .md .hljs-attr, .md .hljs-attribute, .md .hljs-variable,
  .md .hljs-template-variable, .md .hljs-symbol, .md .hljs-bullet, .md .hljs-link,
  .md .hljs-selector-attr, .md .hljs-selector-pseudo { color: var(--hl-number); }
  .md .hljs-title, .md .hljs-section, .md .hljs-selector-id, .md .hljs-selector-class { color: var(--hl-title); }
  .md .hljs-built_in, .md .hljs-type { color: var(--hl-builtin); }
  .md .hljs-name, .md .hljs-tag { color: var(--hl-tag); }
  .md .hljs-emphasis { font-style: italic; }
  .md .hljs-strong { font-weight: 700; }

  .md .table-wrap { overflow-x: auto; margin-bottom: 1em; }
  .md table { border-collapse: collapse; margin: 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 14px; }
  .md th { background: var(--bg-soft); }

  .md input[type="checkbox"] { margin-inline-end: 0.4em; }

  /* formulas are always left-to-right */
  .md .katex { direction: ltr; unicode-bidi: isolate; font-size: 1.1em; }
  .md .math-block { direction: ltr; overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 0 0 1em; }
  .md .math-block .katex-display { margin: 0.4em 0; }

  @media print {
    :root, :root[data-theme="dark"] {
      --bg: #fff; --bg-soft: #f5f6f8; --fg: #000; --muted: #555;
      --border: #ccc; --accent: #0b63ce; --code-bg: #f1f3f5; --mark: #fff3bf;
      --hl-comment: #6e7781; --hl-keyword: #cf222e; --hl-string: #0a3069; --hl-number: #0550ae;
      --hl-title: #8250df; --hl-builtin: #953800; --hl-tag: #116329;
    }
    header, #tabs, #editor, #divider, .md .copy { display: none !important; }
    .md pre { white-space: pre-wrap; }
    body, main, #preview { display: block; height: auto; overflow: visible; }
    #preview { padding: 0; }
  }
</style>
</head>

<body>
<header>
  <div class="name" id="name">MD Viewer</div>
  <button id="btn-open" title="باز کردن فایل ‎.md (Ctrl+O)">📂 باز کردن</button>
  <button id="btn-save" title="ذخیره به صورت فایل ‎.md (Ctrl+S)">💾 ذخیره</button>
  <button id="btn-pdf" title="چاپ یا ذخیره به صورت PDF">🖨️ PDF</button>
  <button id="btn-dir" title="جهت متن: خودکار / راست‌به‌چپ / چپ‌به‌راست"></button>
  <button id="btn-editor" title="نمایش/پنهان کردن ویرایشگر">✏️ ویرایشگر</button>
  <button id="btn-theme" title="تغییر تم"></button>
  <input type="file" id="file" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" multiple hidden>
</header>

<nav id="tabs"></nav>

<main>
  <textarea id="editor" spellcheck="false" placeholder="متن Markdown را اینجا بنویسید یا یک فایل را به داخل صفحه بکشید…"></textarea>
  <div id="divider"></div>
  <div id="preview" tabindex="-1"><article class="md" id="out"></article></div>
</main>

<script type="text/markdown" id="sample"># راهنمای MD Viewer

این یک نمایشگر ساده‌ی **Markdown** است که متن فارسی و English را در کنار هم درست نمایش می‌دهد.
هر پاراگراف جهت خودش را از اولین حرف می‌گیرد.

This paragraph starts in English, so it is left-to-right — even if it contains کلمات فارسی in the middle.

## فرمول‌ها (LaTeX)

فرمول درون‌خطی مثل $E = mc^2$ یا \(a^2 + b^2 = c^2\) وسط متن فارسی می‌آید، و فرمول جدا:

$$
\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
$$

\[
\hat{f}(\xi) = \int_{-\infty}^{\infty} f(x)\, e^{-2\pi i x \xi}\, dx
\]

قیمت‌ها مثل $5 و $10 فرمول حساب نمی‌شوند.

## فهرست و جدول

- مورد اول با `inline code`
- Second item in English
- [x] کار انجام‌شده
- [ ] کار باقی‌مانده

| نام | Symbol | مقدار |
|-----|:------:|------:|
| عدد پی | $\pi$ | 3.14159 |
| عدد اویلر | $e$ | 2.71828 |

## کد

```python
def greet(name):
    return f"سلام {name}!"
```

```julia
f(x) = x^2 + 1          # تابع یک‌خطی
println(sum(f, 1:10))
```

> نقل‌قول: برای باز کردن فایل، آن را به داخل صفحه بکشید یا دکمه‌ی «باز کردن» را بزنید.
</script>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var editor = $('editor'), out = $('out'), nameEl = $('name');

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- math: tokenized by marked so markdown never mangles the TeX ---------- */

  function escAttr(s) {
    return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var blockRules = [
    /^ {0,3}\$\$([\s\S]+?)\$\$[ \t]*(?:\n+|$)/,
    /^ {0,3}\\\[([\s\S]+?)\\\][ \t]*(?:\n+|$)/
  ];
  // [rule, displayMode]
  var inlineRules = [
    [/^\$\$([\s\S]+?)\$\$/, true],
    [/^\\\[([\s\S]+?)\\\]/, true],
    [/^\\\(([\s\S]+?)\\\)/, false],
    // $...$: no space just inside the dollars and no digit right after, so "$5 and $10" stays text
    [/^\$(?!\s)((?:\\.|[^$\\\n])*?(?:\\.|[^$\\\n\s]))\$(?!\d)/, false]
  ];

  marked.use({
    gfm: true,
    extensions: [
      {
        name: 'mathBlock',
        level: 'block',
        start: function (src) {
          var m = src.match(/^ {0,3}(?:\$\$|\\\[)/m);
          return m ? m.index : undefined;
        },
        tokenizer: function (src) {
          for (var i = 0; i < blockRules.length; i++) {
            var m = blockRules[i].exec(src);
            if (m) return { type: 'mathBlock', raw: m[0], tex: m[1].trim() };
          }
        },
        renderer: function (t) {
          return '<div class="math-block" data-tex="' + escAttr(t.tex) + '"></div>\n';
        }
      },
      {
        name: 'mathInline',
        level: 'inline',
        start: function (src) {
          var i = src.search(/\$|\\[(\[]/);
          return i < 0 ? undefined : i;
        },
        tokenizer: function (src) {
          for (var i = 0; i < inlineRules.length; i++) {
            var m = inlineRules[i][0].exec(src);
            if (m) return { type: 'mathInline', raw: m[0], tex: m[1].trim(), display: inlineRules[i][1] };
          }
        },
        renderer: function (t) {
          return '<span class="math-inline" data-tex="' + escAttr(t.tex) + '"' +
                 (t.display ? ' data-display="1"' : '') + '></span>';
        }
      }
    ]
  });

  /* ---------- render ---------- */

  hljs.registerAliases('jl', { languageName: 'julia' });

  var DIR_LABEL = { auto: '↔ خودکار', rtl: '← راست‌به‌چپ', ltr: '→ چپ‌به‌راست' };
  var dirMode = store.get('mdv-dir');
  if (!DIR_LABEL[dirMode]) dirMode = 'auto';

  function applyDir() {
    $('btn-dir').textContent = DIR_LABEL[dirMode];
    if (dirMode === 'auto') editor.removeAttribute('dir');
    else editor.setAttribute('dir', dirMode);
  }

  var AUTO_DIR = 'h1,h2,h3,h4,h5,h6,p,ul,ol,li,blockquote,table,th,td,dt,dd';

  function render() {
    // Sanitize the markdown output first, then let KaTeX fill in the formulas.
    out.innerHTML = DOMPurify.sanitize(marked.parse(editor.value));

    out.querySelectorAll('.math-block, .math-inline').forEach(function (el) {
      var display = el.classList.contains('math-block') || el.dataset.display === '1';
      try {
        katex.render(el.dataset.tex || '', el, { displayMode: display, throwOnError: false });
      } catch (e) {
        el.textContent = el.dataset.tex;
      }
    });

    // Per-block direction: in auto mode Persian blocks become RTL, English ones LTR.
    out.querySelectorAll(AUTO_DIR).forEach(function (el) {
      el.setAttribute('dir', dirMode);
    });

    out.querySelectorAll('table').forEach(function (t) {
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.dir = dirMode;
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });

    // Highlight fenced code whose language is known; unlabelled blocks stay plain.
    out.querySelectorAll('pre > code[class*="language-"]').forEach(function (code) {
      var m = /(?:^|\s)language-(\S+)/.exec(code.className);
      if (!m || !hljs.getLanguage(m[1])) return;
      try {
        code.innerHTML = hljs.highlight(code.textContent, { language: m[1], ignoreIllegals: true }).value;
      } catch (e) {}
    });

    out.querySelectorAll('pre').forEach(function (pre) {
      var wrap = document.createElement('div');
      wrap.className = 'code-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      var b = document.createElement('button');
      b.className = 'copy';
      b.textContent = 'کپی';
      b.addEventListener('click', function () {
        navigator.clipboard.writeText(pre.textContent).then(function () {
          b.textContent = '✓';
          setTimeout(function () { b.textContent = 'کپی'; }, 1200);
        });
      });
      wrap.appendChild(b);
    });

    out.querySelectorAll('a[href]').forEach(function (a) {
      if (/^https?:/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
  }

  /* ---------- tabs: each open document keeps its own text, file location and scroll ---------- */

  var tabsEl = $('tabs'), preview = $('preview');
  var tabs = [], active = null, seq = 0, restoring = false;

  function newTab(d) {
    d = d || {};
    return {
      id: ++seq, name: d.name || '', text: d.text || '', dirty: !!d.dirty,
      path: d.path || null,      // desktop app: full path of the file on disk
      handle: d.handle || null,  // Chrome/Edge: file handle (lost on reload)
      top: 0, ptop: 0
    };
  }

  function persist() {
    store.set('mdv-tabs', JSON.stringify(tabs.map(function (t) {
      return { name: t.name, text: t.text, path: t.path, dirty: t.dirty };
    })));
    store.set('mdv-active', String(tabs.indexOf(active)));
  }

  function paintTabs() {
    tabsEl.textContent = '';
    tabs.forEach(function (tab) {
      var el = document.createElement('div');
      el.className = 'tab' + (tab === active ? ' active' : '') + (tab.dirty ? ' dirty' : '');
      el.title = tab.path || tab.name;
      var n = document.createElement('span');
      n.className = 'tab-name';
      n.textContent = tab.name || 'بدون نام';
      var x = document.createElement('button');
      x.className = 'tab-close' + (tab.confirm ? ' confirm' : '');
      x.textContent = tab.confirm ? 'بدون ذخیره بسته شود؟' : '×';
      x.title = 'بستن تب (Ctrl+W)';
      x.addEventListener('click', function (e) { e.stopPropagation(); closeTab(tab); });
      el.addEventListener('click', function () { activate(tab); });
      el.addEventListener('auxclick', function (e) { if (e.button === 1) closeTab(tab); });
      el.appendChild(n);
      el.appendChild(x);
      tabsEl.appendChild(el);
    });
    var add = document.createElement('button');
    add.id = 'tab-new';
    add.textContent = '+';
    add.title = 'تب جدید (Ctrl+N)';
    add.addEventListener('click', function () { addTab(); });
    tabsEl.appendChild(add);

    nameEl.textContent = active.name || 'MD Viewer';
    document.title = active.name ? active.name + ' — MD Viewer' : 'MD Viewer';
  }

  function activate(tab) {
    if (active) { active.top = editor.scrollTop; active.ptop = preview.scrollTop; }
    active = tab;
    editor.value = tab.text;
    render();
    // put both panes back where this tab was, without the scroll sync fighting it
    restoring = true;
    editor.scrollTop = tab.top;
    preview.scrollTop = tab.ptop;
    setTimeout(function () { restoring = false; }, 100);
    paintTabs();
    persist();
  }

  function addTab(d) {
    var tab = newTab(d);
    tabs.push(tab);
    activate(tab);
  }

  function closeTab(tab) {
    var i = tabs.indexOf(tab);
    if (i < 0) return;
    // unsaved text: the first click only arms the button, the second one closes
    if (tab.dirty && tab.text && !tab.confirm) {
      tab.confirm = true;
      paintTabs();
      setTimeout(function () {
        if (tab.confirm) { tab.confirm = false; paintTabs(); }
      }, 3000);
      return;
    }
    tab.confirm = false;
    tabs.splice(i, 1);
    if (!tabs.length) tabs.push(newTab());
    if (tab === active) {
      active = null;
      activate(tabs[Math.min(i, tabs.length - 1)]);
    } else {
      paintTabs();
      persist();
    }
  }

  function cycleTab(step) {
    activate(tabs[(tabs.indexOf(active) + step + tabs.length) % tabs.length]);
  }

  var timer;
  editor.addEventListener('input', function () {
    active.text = editor.value;
    if (!active.dirty) { active.dirty = true; paintTabs(); }
    clearTimeout(timer);
    timer = setTimeout(function () {
      render();
      persist();
    }, 120);
  });

  /* ---------- files ---------- */

  var FILE_TYPES = [{
    description: 'Markdown',
    accept: { 'text/markdown': ['.md', '.markdown', '.mdown'], 'text/plain': ['.txt'] }
  }];

  function report(err) {
    if (!err || err.name !== 'AbortError') alert(err);
  }

  // The tab that already shows this file, if any.
  function sameFile(d) {
    if (d.path) return Promise.resolve(tabs.filter(function (t) { return t.path === d.path; })[0]);
    if (!d.handle) return Promise.resolve(null);
    return Promise.all(tabs.map(function (t) {
      return t.handle ? t.handle.isSameEntry(d.handle) : false;
    })).then(function (same) { return tabs[same.indexOf(true)]; });
  }

  // Show a document in a tab: its existing tab, the untouched starting tab, or a new one.
  function openDoc(d) {
    return sameFile(d).then(function (tab) {
      if (tab) {
        if (!tab.dirty) tab.text = d.text;
      } else {
        tab = newTab(d);
        var blank = !active.dirty && !active.name && !active.path && !active.handle;
        if (blank) { tabs.splice(tabs.indexOf(active), 1, tab); active = null; }
        else tabs.push(tab);
      }
      activate(tab);
    });
  }

  function openDocs(docs) {
    return docs.reduce(function (p, d) {
      return p.then(function () { return openDoc(d); });
    }, Promise.resolve());
  }

  // File objects from the file input or a drop; the browser hides where they live.
  function openFileObjects(files) {
    return Promise.all(Array.prototype.map.call(files, function (f) {
      return f.text().then(function (text) { return { name: f.name, text: text }; });
    })).then(openDocs).catch(report);
  }

  function openFiles() {
    // Desktop app: a native dialog, so the file's path is known for saving later.
    var tauri = window.__TAURI__;
    if (tauri && tauri.core) {
      tauri.core.invoke('open_markdown', { path: active.path }).then(function (files) {
        return openDocs(files.map(function (f) { return { name: f.name, path: f.path, text: f.contents }; }));
      }).catch(report);
      return;
    }
    if (window.showOpenFilePicker) {
      var opts = { id: 'mdv', multiple: true, types: FILE_TYPES };
      if (active.handle) opts.startIn = active.handle;
      window.showOpenFilePicker(opts).then(function (handles) {
        return Promise.all(handles.map(function (h) {
          return h.getFile()
            .then(function (f) { return f.text(); })
            .then(function (text) { return { name: h.name, handle: h, text: text }; });
        }));
      }).then(openDocs).catch(report);
      return;
    }
    $('file').click();
  }

  $('btn-open').addEventListener('click', openFiles);
  $('file').addEventListener('change', function (e) {
    openFileObjects(e.target.files);
    e.target.value = '';
  });

  var dragDepth = 0;
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0; }
  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    dragDepth++;
    document.body.classList.add('dragging');
  });
  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
  });
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    openFileObjects(e.dataTransfer.files);
  });

  /* ---------- theme & editor toggle ---------- */

  var root = document.documentElement;
  function paintThemeButton() {
    $('btn-theme').textContent = root.dataset.theme === 'dark' ? '☀️ روشن' : '🌙 تاریک';
  }
  $('btn-theme').addEventListener('click', function () {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    store.set('mdv-theme', root.dataset.theme);
    paintThemeButton();
  });
  paintThemeButton();

  if (store.get('mdv-editor') === '0') document.body.classList.add('no-editor');
  $('btn-editor').addEventListener('click', function () {
    var hidden = document.body.classList.toggle('no-editor');
    store.set('mdv-editor', hidden ? '0' : '1');
  });

  $('btn-dir').addEventListener('click', function () {
    dirMode = dirMode === 'auto' ? 'rtl' : dirMode === 'rtl' ? 'ltr' : 'auto';
    store.set('mdv-dir', dirMode);
    applyDir();
    render();
  });
  applyDir();

  /* ---------- save / print ---------- */

  function markSaved(tab, d) {
    if (d.name) tab.name = d.name;
    if (d.path) tab.path = d.path;
    if (d.handle) tab.handle = d.handle;
    tab.dirty = false;
    paintTabs();
    persist();
    flashSave('✓ ذخیره شد');
  }

  function flashSave(msg) {
    var b = $('btn-save');
    b.textContent = msg;
    setTimeout(function () { b.textContent = '💾 ذخیره'; }, 1200);
  }

  function saveTab() {
    var tab = active, text = tab.text, n = tab.name || 'document.md';
    // Nothing changed since the file was opened or last saved: no dialog.
    if (tab.name && !tab.dirty) { flashSave('✓ بدون تغییر'); return; }

    // Desktop app: a native save dialog that starts in the file's own folder.
    var tauri = window.__TAURI__;
    if (tauri && tauri.core) {
      tauri.core.invoke('save_markdown', { name: n, path: tab.path, contents: text }).then(function (path) {
        if (path) markSaved(tab, { path: path, name: path.split(/[\\/]/).pop() });
      }).catch(report);
      return;
    }
    if (window.showSaveFilePicker) {
      var opts = { id: 'mdv', suggestedName: n, types: FILE_TYPES }, handle;
      if (tab.handle) opts.startIn = tab.handle;
      window.showSaveFilePicker(opts)
        .then(function (h) { handle = h; return h.createWritable(); })
        .then(function (w) { return w.write(text).then(function () { return w.close(); }); })
        .then(function () { markSaved(tab, { handle: handle, name: handle.name }); })
        .catch(report);
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    a.download = n;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    markSaved(tab, {});
  }

  $('btn-save').addEventListener('click', saveTab);
  $('btn-pdf').addEventListener('click', function () { window.print(); });
  // The Android WebView has no print dialog, so the button would do nothing there.
  if (window.__TAURI__ && /Android/.test(navigator.userAgent)) $('btn-pdf').hidden = true;

  /* ---------- keyboard shortcuts ---------- */

  // Matched by physical key (e.code) so they also work on the Persian layout.
  // Browsers keep Ctrl+N/W/Tab for themselves; those three only reach us in the desktop app.
  window.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    var run = {
      KeyO: openFiles,
      KeyS: saveTab,
      KeyN: function () { addTab(); },
      KeyW: function () { closeTab(active); },
      Tab: function () { cycleTab(e.shiftKey ? -1 : 1); }
    }[e.code];
    if (!run || (e.shiftKey && e.code !== 'Tab')) return;
    e.preventDefault();
    run();
  });

  // Scroll keys pressed with nothing scrollable focused (at start, or after clicking a
  // button or a tab) would scroll nothing; hand focus to the preview so they scroll it.
  var SCROLL_KEYS = { PageDown: 1, PageUp: 1, Home: 1, End: 1, ArrowDown: 1, ArrowUp: 1, ' ': 1 };
  window.addEventListener('keydown', function (e) {
    if (!SCROLL_KEYS[e.key] || e.ctrlKey || e.metaKey || e.altKey) return;
    var el = document.activeElement;
    var idle = !el || el === document.body ||
      (el.tagName === 'BUTTON' && e.key !== ' ' && !preview.contains(el));
    if (idle) preview.focus({ preventScroll: true });
  });

  /* ---------- resizable divider ---------- */

  var mainEl = document.querySelector('main'), divider = $('divider');
  var split = store.get('mdv-split');
  if (split) mainEl.style.setProperty('--split', split);
  divider.addEventListener('pointerdown', function (e) {
    divider.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
  });
  divider.addEventListener('pointermove', function (e) {
    if (!divider.hasPointerCapture(e.pointerId)) return;
    var r = mainEl.getBoundingClientRect();
    var pct = Math.min(85, Math.max(15, (e.clientX - r.left) / r.width * 100));
    split = pct.toFixed(1) + '%';
    mainEl.style.setProperty('--split', split);
  });
  divider.addEventListener('pointerup', function () {
    document.body.classList.remove('resizing');
    if (split) store.set('mdv-split', split);
  });
  divider.addEventListener('dblclick', function () {
    mainEl.style.removeProperty('--split');
    store.set('mdv-split', '');
  });

  /* ---------- synced scrolling (proportional) ---------- */

  var scrollLock = null;
  function sync(from, to) {
    from.addEventListener('scroll', function () {
      if (restoring) return;
      if (scrollLock === from) { scrollLock = null; return; }
      var max = from.scrollHeight - from.clientHeight;
      if (max <= 0) return;
      var top = Math.round(from.scrollTop / max * (to.scrollHeight - to.clientHeight));
      if (Math.abs(top - to.scrollTop) < 1) return;
      scrollLock = to;
      to.scrollTop = top;
    });
  }
  sync(editor, preview);
  sync(preview, editor);

  /* ---------- start ---------- */

  var restored = null;
  try { restored = JSON.parse(store.get('mdv-tabs')); } catch (e) {}
  if (Array.isArray(restored) && restored.length) {
    tabs = restored.map(function (d) { return newTab(d); });
  } else if (store.get('mdv-text')) {
    // text kept by a version that had a single document
    var oldName = store.get('mdv-name');
    tabs = [newTab({ name: oldName, text: store.get('mdv-text'), dirty: !oldName })];
  } else {
    tabs = [newTab({ text: $('sample').textContent })];
  }
  activate(tabs[+store.get('mdv-active')] || tabs[0]);

  // Desktop app: files opened from the system (double click, "Open With") wait in the
  // backend; take them now and whenever it announces more.
  var tauri = window.__TAURI__;
  if (tauri && tauri.core) {
    var opening = Promise.resolve();
    var takePending = function () {
      opening = opening.then(function () {
        return tauri.core.invoke('pending_files');
      }).then(function (files) {
        return openDocs(files.map(function (f) { return { name: f.name, path: f.path, text: f.contents }; }));
      }).catch(report);
    };
    tauri.event.listen('files-pending', takePending).then(takePending, takePending);
  }
})();
</script>
</body>
</html>
